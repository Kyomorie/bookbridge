name: Issue 215 validation

on:
  push:
    branches:
      - feature/issue-215-pending-rewind
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile \
            src/services/pending_rewind_service.py \
            src/sync_clients/abs_sync_client.py \
            tests/test_pending_rewind.py
      - name: Focused regressions
        run: |
          pytest -q tests/test_pending_rewind.py tests/test_abs_policy_skip_result.py
