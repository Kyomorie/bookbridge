name: PR2 slice 1 persistence

on:
  push:
    branches:
      - feature/kosync-abs-rewind-approval

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed repository preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch origin feature/kosync-abs-rewind-approval
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/kosync-abs-rewind-approval)"
          git fetch --no-tags https://github.com/cporcellijr/bookbridge.git dev:refs/remotes/upstream/dev
          test "$(git rev-parse refs/remotes/upstream/dev)" = "6afbdc68de3e67298d0def330e0d15cf8c6781e2"
          test -z "$(git status --porcelain)"
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y lua5.4 >/dev/null
          python -m pip install --upgrade pip >/dev/null
          pip install flake8 pytest pytest-cov >/dev/null
          pip install -r requirements.txt >/dev/null
      - name: Verify current migration head
        shell: bash
        run: |
          set -euo pipefail
          test "$(alembic heads | sed '/^[[:space:]]*$/d' | wc -l)" -eq 1
          alembic heads | grep -q '^2e0a47a3dadd'
      - name: Apply slice 1 patch
        run: python .github/pr2-slice1-patch.py
      - name: Validate slice 1 migration and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(alembic heads | sed '/^[[:space:]]*$/d' | wc -l)" -eq 1
          alembic heads | grep -q '^b4d7e9f2c1a6'
          flake8 src/db/models.py src/db/database_service.py src/utils/config_loader.py tests/test_pending_rewinds.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test slice 1 persistence contract
        run: pytest -q tests/test_pending_rewinds.py
      - name: Test existing database and settings regressions
        run: pytest -q tests/test_database_service_integration.py tests/test_settings_comprehensive.py tests/test_settings_save_key_allowlist.py tests/test_settings_taxonomy.py
      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/kosync-abs-rewind-approval
          test "$(git rev-parse origin/feature/kosync-abs-rewind-approval)" = "$BASE_HEAD"
          git fetch --no-tags https://github.com/cporcellijr/bookbridge.git dev:refs/remotes/upstream/dev
          test "$(git rev-parse refs/remotes/upstream/dev)" = "6afbdc68de3e67298d0def330e0d15cf8c6781e2"
          rm -f .github/workflows/pr2-slice1-persistence.yml .github/pr2-slice1-patch.py
          git config user.name "Kyomorie"
          git config user.email "246901271+Kyomorie@users.noreply.github.com"
          git add -A -- src/db/models.py src/db/database_service.py src/utils/config_loader.py alembic/versions/b4d7e9f2c1a6_add_pending_rewinds.py tests/test_pending_rewinds.py .github/workflows/pr2-slice1-persistence.yml .github/pr2-slice1-patch.py
          git diff --cached --check
          git commit -m "[Feature] Persist pending KoSync ABS rewind decisions"
          git push origin HEAD:feature/kosync-abs-rewind-approval
