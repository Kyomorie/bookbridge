name: Repair PR 397 against current dev

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/current-reading-position-preview
          fetch-depth: 0

      - name: Merge current upstream dev deterministically
        shell: bash
        run: |
          set -euo pipefail

          expected_head='0f8d351a46bb712ff074905667935978eb3a32d8'
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$expected_head" ]; then
            echo "Feature head moved unexpectedly: $actual_head (expected $expected_head)" >&2
            exit 1
          fi

          git remote add upstream https://github.com/cporcellijr/bookbridge.git
          git fetch --no-tags upstream dev
          upstream_head="$(git rev-parse upstream/dev)"
          merge_base="$(git merge-base HEAD upstream/dev)"
          echo "feature=$actual_head"
          echo "upstream/dev=$upstream_head"
          echo "merge-base=$merge_base"

          # Save only the real #397 dashboard-template change. It consists of
          # three insertion hunks and is reapplied to the current dev template
          # after the merge so upstream template fixes remain byte-for-byte.
          git diff --binary "$merge_base" HEAD -- templates/index.html > /tmp/pr397-index.patch
          test -s /tmp/pr397-index.patch

          set +e
          git merge --no-commit --no-ff upstream/dev
          merge_rc=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          if [ "${#conflicts[@]}" -gt 0 ]; then
            printf 'Merge conflicts:\n'
            printf '  %s\n' "${conflicts[@]}"
            for file in "${conflicts[@]}"; do
              case "$file" in
                CHANGELOG.md|templates/index.html) ;;
                *)
                  echo "Unexpected conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done
          elif [ "$merge_rc" -ne 0 ]; then
            echo "git merge failed without a normal file conflict" >&2
            exit 1
          fi

          # Resolve the dashboard from current dev, then apply exactly the
          # original #397 insertion patch. This deliberately preserves all
          # newer dev fixes, including the markComplete/tojson fix.
          git show upstream/dev:templates/index.html > templates/index.html
          git apply --check /tmp/pr397-index.patch
          git apply /tmp/pr397-index.patch

          # Resolve CHANGELOG from current dev and add only the #397 entry.
          # This intentionally drops the unrelated historical wording edit
          # that had slipped into the original feature branch.
          git show upstream/dev:CHANGELOG.md > CHANGELOG.md
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = """- **Dashboard cards can now show the text around your current reading position.**
            On any mapping with an ebook, click *Show position* beside the progress bar to
            open a short, on-demand excerpt with a marker at the saved position. BookBridge
            uses an exact XPath or CFI when available, maps audiobook time through the stored
            audio↔ebook alignment, and clearly labels percentage-only fallbacks as
            approximate instead of pretending they are exact. The preview is scoped to the
            signed-in reader and is not offered for audiobook-only mappings. Contributed by
            @Kyomorie.

          """
          if entry.strip() not in text:
              unreleased = '## [Unreleased]\n\n'
              if text.count(unreleased) != 1:
                  raise SystemExit(f'Unexpected Unreleased anchor count: {text.count(unreleased)}')
              added = unreleased + '### Added\n\n'
              if added in text:
                  text = text.replace(added, added + entry, 1)
              else:
                  fixed = unreleased + '### Fixed\n\n'
                  if fixed not in text:
                      raise SystemExit('Could not locate Added or Fixed section under Unreleased')
                  text = text.replace(fixed, unreleased + '### Added\n\n' + entry + '### Fixed\n\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git add CHANGELOG.md templates/index.html

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          # Hard invariants for the two conflict-prone files.
          grep -Fq "onclick='markComplete({{ mapping.abs_id|tojson }}, {{ mapping.abs_title|tojson }})'" templates/index.html
          test "$(grep -Fc 'data-position-preview-toggle' templates/index.html)" -eq 1
          test "$(grep -Fc '/static/css/reading-position-preview.css' templates/index.html)" -eq 1
          test "$(grep -Fc '/static/js/reading-position-preview.js' templates/index.html)" -eq 1
          test "$(grep -Fc 'Dashboard cards can now show the text around your current reading position.' CHANGELOG.md)" -eq 1
          ! grep -Fq 'no more downloading a ZIP from GitHub Releases.' CHANGELOG.md

          git diff --cached --check

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies for Python 3.11
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint and test on Python 3.11
        shell: bash
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest tests/test_reading_position_preview.py tests/test_reading_position_preview_routes.py tests/test_reading_position_preview_ui.py tests/test_webserver_mark_complete.py tests/test_add_book_card_layout.py
          pytest tests/

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies for Python 3.12
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint and test on Python 3.12
        shell: bash
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest tests/test_reading_position_preview.py tests/test_reading_position_preview_routes.py tests/test_reading_position_preview_ui.py tests/test_webserver_mark_complete.py tests/test_add_book_card_layout.py
          pytest tests/

      - name: Commit and push repaired feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[Chore] Merge current dev into reading position preview'
          git push origin HEAD:feature/current-reading-position-preview
