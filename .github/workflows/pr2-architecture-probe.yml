name: PR2 architecture probe

on:
  push:
    branches:
      - feature/kosync-abs-rewind-approval

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gather architecture report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          out = []
          def add(title, text):
              out.append(f"\n===== {title} =====\n{text.rstrip()}\n")

          def around(path, needle, before=20, after=80, occurrence=1):
              p = Path(path)
              if not p.exists(): return f"MISSING {path}"
              lines = p.read_text(errors='replace').splitlines()
              hits = [i for i,l in enumerate(lines) if needle in l]
              if len(hits) < occurrence: return f"NOT FOUND: {needle} in {path}"
              i = hits[occurrence-1]
              a=max(0,i-before); b=min(len(lines),i+after+1)
              return '\n'.join(f"{n+1:05d}: {lines[n]}" for n in range(a,b))

          add('PendingSuggestion model', around('src/db/models.py', 'class PendingSuggestion', 10, 90))

          refs=[]
          for p in Path('src').rglob('*.py'):
              txt=p.read_text(errors='replace')
              if 'PendingSuggestion' in txt and str(p) != 'src/db/models.py':
                  for n,l in enumerate(txt.splitlines(),1):
                      if 'PendingSuggestion' in l:
                          refs.append(f"{p}:{n}: {l}")
          add('PendingSuggestion references', '\n'.join(refs) or 'NONE')

          refs=[]
          for p in list(Path('src').rglob('*')) + list(Path('templates').rglob('*')) if Path('templates').exists() else list(Path('src').rglob('*')):
              if not p.is_file(): continue
              try: txt=p.read_text(errors='replace')
              except: continue
              if 'KOSYNC_FURTHEST_WINS' in txt:
                  for n,l in enumerate(txt.splitlines(),1):
                      if 'KOSYNC_FURTHEST_WINS' in l:
                          refs.append(f"{p}:{n}: {l}")
          add('KOSYNC_FURTHEST_WINS references', '\n'.join(refs) or 'NONE')

          add('ABSSyncClient.update_progress', around('src/sync_clients/abs_sync_client.py', 'def update_progress', 20, 180))
          add('SyncManager record write', around('src/sync_manager.py', 'def _record_bridge_write', 15, 80))
          add('SyncManager follower update call #1', around('src/sync_manager.py', 'client.update_progress(book, request)', 40, 110, 1))

          refs=[]
          for p in Path('src').rglob('*.py'):
              txt=p.read_text(errors='replace')
              for n,l in enumerate(txt.splitlines(),1):
                  low=l.lower()
                  if 'suggestion' in low and ('route' in low or 'pending' in low or 'approve' in low or 'dismiss' in low):
                      refs.append(f"{p}:{n}: {l}")
          add('Suggestion route/service references', '\n'.join(refs[:300]) or 'NONE')

          for root in ['src/templates','templates']:
              rp=Path(root)
              if not rp.exists(): continue
              refs=[]
              for p in rp.rglob('*'):
                  if p.is_file():
                      txt=p.read_text(errors='replace')
                      for n,l in enumerate(txt.splitlines(),1):
                          if 'suggest' in l.lower() or 'csrf' in l.lower():
                              refs.append(f"{p}:{n}: {l}")
              add(f'{root} suggestion/csrf refs', '\n'.join(refs[:400]) or 'NONE')

          add('config_loader setting lists', around('src/config_loader.py', 'ALL_SETTINGS', 20, 140))
          add('config_loader default config', around('src/config_loader.py', 'DEFAULT_CONFIG', 20, 160))

          # Compute Alembic graph heads without importing project dependencies.
          revs={}
          for p in Path('alembic/versions').glob('*.py'):
              txt=p.read_text(errors='replace')
              mr=re.search(r'^revision\s*=\s*[\'\"]([^\'\"]+)', txt, re.M)
              md=re.search(r'^down_revision\s*=\s*(.+)$', txt, re.M)
              if mr:
                  rev=mr.group(1); downs=[]
                  if md:
                      raw=md.group(1).strip()
                      downs=re.findall(r'[\'\"]([^\'\"]+)[\'\"]', raw)
                  revs[rev]=(str(p),downs)
          referenced={d for _,ds in revs.values() for d in ds}
          heads=[(r,revs[r][0]) for r in revs if r not in referenced]
          add('Alembic heads (parsed)', '\n'.join(f"{r} {p}" for r,p in sorted(heads)))

          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/pr2-architecture-probe.txt').write_text('\n'.join(out))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name "Kyomorie"
          git config user.email "246901271+Kyomorie@users.noreply.github.com"
          git add tmp/pr2-architecture-probe.txt
          git commit -m "chore: capture PR2 architecture probe"
          git push
